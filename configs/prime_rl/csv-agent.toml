# Prime-RL smoke configuration for the csv-agent Verifiers environment.
#
# Prepare splits first:
#   uv run python -m src.training.split_episodes \
#     --input data/episodes/template.jsonl \
#     --output-dir data/splits/template
#
# Install this repo in the Prime-RL environment, then dry-run from prime-rl:
#   uv pip install -e /home/j/Projects/csv-agent
#   uv run rl @ /home/j/Projects/csv-agent/configs/prime_rl/csv-agent.toml --dry-run

max_steps = 20
seq_len = 4096

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
project = "csv-agent"
name = "csv-agent-smoke"

[trainer.model]
impl = "auto"

[trainer.model.lora]
rank = 16
alpha = 32

[trainer.optim]
lr = 1e-5

[orchestrator]
batch_size = 64
group_size = 4

[orchestrator.train.sampling]
max_completion_tokens = 2048

[[orchestrator.train.env]]
id = "csv-agent"
name = "csv-agent-train"
args = { episodes_path = "data/splits/template/train.jsonl", csv_root = "data/kaggle", max_turns = 10 }

[orchestrator.eval]
interval = 10
num_examples = 50
group_size = 4

[[orchestrator.eval.env]]
id = "csv-agent"
name = "csv-agent-val"
args = { episodes_path = "data/splits/template/val.jsonl", csv_root = "data/kaggle", max_turns = 10 }

[inference]

[orchestrator.renderer]
name = "qwen3"
preserve_all_thinking = true
